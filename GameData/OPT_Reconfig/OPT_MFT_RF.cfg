// Modular/Real Fuels for OPT Spaceplane
// Author: JadeOfMaar

@PART:HAS[#manufacturer[OPT*Division],#refVolume[*]]:NEEDS[ModularFuelTanks|RealFuels]
{
	MODULE
	{
		name = ModuleFuelTanks
		volume = #$../refVolume$
		@volume:NEEDS[RealFuels] *= 5
		type = Fuselage
		tag = #$../TankTag$
	}
}

// IntakeAir gets a density nerf in RealFuels/Resources/ResourcesFuel.cfg
// Might as well mirror it; do as the Romans when in Rome
@RESOURCE_DEFINITION[IntakeAtm]:AFTER[RealFuels]
{
	@density = 0.001225
}

@TANK_DEFINITION[Fuselage]:AFTER[RealFuels]
{
	TANK
	{
		name = IntakeAtm
		mass = 0.000012
		utilization = 1
		fillable = True
		amount = 0.0
		maxAmount = 0.0
	}
}