@PART[opt_?_wrapRad?|opt_?_beltRad?]:NEEDS[SystemHeat]
{
	!MODULE[ModuleAnimateHeat] {}
	MODULE
	{
		name = ModuleSystemHeatColorAnimator
		moduleID = heat
		useRate = false
		animRate = 1
		shaderProperty = _EmissiveColor
		toggleInEditor = false
		toggleInFlight = false
		redCurve
		{
			key = 0 0
			key = 0.4 1 2.27 0
			key = 1 1
		}
		greenCurve
		{
			key = 0 0
			key = 0.2 0 0 2.18
			key = 0.6 1 2.36 0
			key = 1 1
		}
		blueCurve
		{
			key = 0 0
			key = 0.4 0 0 2.18
			key = 0.8 1 2.41 0
			key = 1 1
		}
		alphaCurve
		{
			key = 0 1
			key = 1 1
		}
	}
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/refArea$
		@volume *= 0.01
		moduleID = default
		iconName = Icon_Radiator
		ignoreTemperature = true
	}
	@MODULE[ModuleActiveRadiator]
	{
		@name = ModuleSystemHeatRadiator
		moduleID = radiator
		// ModuleSystemHeat instance to link to
		systemHeatModuleID = default
		scalarModuleID = heat
		maxTempAnimation = #$/maxTemp$

		// option: use deterministic temperatures
		// Power radiated per temperature
		temperatureCurve
		{
			key = 0 0
			key = 0.2 0.0016
			key = 0.4 0.0256
			key = 0.6 0.1296
			key = 0.8 0.4096
			key = 1 1
			@key,*[0, ] *= #$/refTemp$
			@key,*[1, ] *= #$/refPower$
		}
		// area for convection
		convectiveArea = #$/refArea$
	}
}

@PART[opt_?_wrapRad?]:NEEDS[SystemHeat]
{
	@MODULE[ModuleB9PartSwitch]
	{
		@SUBTYPE,1
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeatRadiator
				}
				DATA
				{
					temperatureCurve
					{
						key = 0 0
						key = #$/refTemp$ $/refPower2$
					}
					RESOURCE
					{
						name = ElectricCharge
						rate = #$/refECReq$
						@rate *= 2
					}
					convectiveArea = #$/refArea$
					@convectiveArea *= 2
				}
			}
		}
	}
}

@PART[opt_?_wrapRad?|opt_?_beltRad?]:NEEDS[zKerbalismSystemHeat]
{
	@MODULE[ModuleSystemHeatRadiator]
	{
		@name = SystemHeatRadiatorKerbalism
	}
	@MODULE[ModuleB9PartSwitch]
	{
		@SUBTYPE,1
		{
			@MODULE:HAS[@IDENTIFIER[ModuleSystemHeatRadiator]]
			{
				@IDENTIFIER
				{
					@name = SystemHeatRadiatorKerbalism
				}
			}
		}
	}
}