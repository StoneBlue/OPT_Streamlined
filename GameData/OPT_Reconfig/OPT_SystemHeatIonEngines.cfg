// Dual mode
@PART[opt_vtol_bubble1]:NEEDS[SystemHeatFissionEngines]
{
	refPowerAScale = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$ // get vac Isp number
	refPowerBScale = #$MODULE[ModuleEnginesFX],1/atmosphereCurve/key,0[1, ]$ // get vac Isp number
	@refPowerAScale /= 4500 // NF Propulsion: 1.25m PIT 
	@refPowerBScale /= 4500
	
	refPowerA1Scale = #$MODULE[ModuleEnginesFX],0/maxThrust$ // get max thrust number
	refPowerB1Scale = #$MODULE[ModuleEnginesFX],1/maxThrust$ // get max thrust number
	@refPowerA1Scale /= 27
	@refPowerB1Scale /= 27
	
	@refPowerAScale *= #$refPowerA1Scale$
	@refPowerBScale *= #$refPowerB1Scale$
	
	// precision sequence to keep div number at 2dp and not let it be 12+dp
	@refPowerAScale += 0.005
	@refPowerAScale *= 100
	@refPowerAScale = #$refPowerAScale[0,.]$ // regex truncate, unknown behavior but used in RO
	@refPowerAScale /= 100
	@refPowerBScale += 0.005
	@refPowerBScale *= 100
	@refPowerBScale = #$refPowerBScale[0,.]$ 
	@refPowerBScale /= 100
	@MODULE[ModuleEnginesFX],*
	{
		@heatProduction = 0
	}
	
	MODULE
	{
		name = ModuleSystemHeat
		// Cubic metres
		volume = #$/mass$
		moduleID = engine
		iconName = Icon_Atom
	}
	MODULE
	{
		name = ModuleSystemHeatEngine
		// must be unique
		moduleID = engine
		// ModuleSystemHeat to link to
		systemHeatModuleID = engine
		engineModuleID = #$/MODULE[ModuleEnginesFX],0/engineID$
		// in KW at peak output
		systemPower = 20
		@systemPower *= #$/refPowerAScale$

		// Nominal system output temperature
		systemOutletTemperature = 1200
		// Valid system temperature range
		temperatureCurve
		{
			key = 0 1.0
			key = 1200 1.0
			key = 1500 0.0
		}
	}
	MODULE
	{
		name = ModuleSystemHeatEngine
		// must be unique
		moduleID = engine
		// ModuleSystemHeat to link to
		systemHeatModuleID = engine
		engineModuleID = #$/MODULE[ModuleEnginesFX],1/engineID$
		// in KW at peak output
		systemPower = 50
		@systemPower *= #$/refPowerBScale$

		// Nominal system output temperature
		systemOutletTemperature = 1200
		// Valid system temperature range
		temperatureCurve
		{
			key = 0 1.0
			key = 1200 1.0
			key = 1500 0.0
		}
	}
}

// Single mode
@PART[opt_sage|opt_surge|opt_vtol_jumpa2|opt_vtol_wrap?2]:NEEDS[SystemHeatFissionEngines]
{
	refPowerAScale = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$ // get vac Isp number
	@refPowerAScale /= 4500 // NF Propulsion: 1.25m PIT 
	
	refPowerA1Scale = #$MODULE[ModuleEnginesFX],0/maxThrust$ // get max thrust number
	@refPowerA1Scale /= 27
	
	@refPowerAScale *= #$refPowerA1Scale$
	
	// precision sequence to keep div number at 2dp and not let it be 12+dp
	@refPowerAScale += 0.005
	@refPowerAScale *= 100
	@refPowerAScale = #$refPowerAScale[0,.]$ // regex truncate, unknown behavior but used in RO
	@refPowerAScale /= 100
	@MODULE[ModuleEnginesFX],*
	{
		@heatProduction = 0
	}
	
	MODULE
	{
		name = ModuleSystemHeat
		// Cubic metres
		volume = #$/mass$
		moduleID = engine
		iconName = Icon_Atom
	}
	MODULE
	{
		name = ModuleSystemHeatEngine
		// must be unique
		moduleID = engine
		// ModuleSystemHeat to link to
		systemHeatModuleID = engine
		engineModuleID = #$/MODULE[ModuleEnginesFX],0/engineID$
		// in KW at peak output
		systemPower = 50
		@systemPower *= #$/refPowerAScale$

		// Nominal system output temperature
		systemOutletTemperature = 1200
		// Valid system temperature range
		temperatureCurve
		{
			key = 0 1.0
			key = 1200 1.0
			key = 1500 0.0
		}
	}
}