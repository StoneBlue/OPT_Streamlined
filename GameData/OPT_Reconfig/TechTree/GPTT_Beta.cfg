//A GPTT patch for OPT Spaceplane Beta, courtesy of Davidinc2008.

//Belt Radiators
@PART[opt_j_beltRadB,opt_k_beltRadB]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_radiator5
}

//Graphene Radiators
@PART[opt_k_wrapRadB,opt_j_wrapRadB,opt_h_wrapRadB]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_radiator4
}

//Advanced Radiators
@PART[opt_k_wrapRadG,opt_j_wrapRadG,opt_h_wrapRadG]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_radiator3
}

//Basic Radiators
@PART[opt_k_wrapRadW,opt_j_wrapRadW,opt_h_wrapRadW]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_radiator2
}

//Wrap intakes
@PART[opt_j_wrapIntake,opt_intakeLinear]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_heavyAirframeConstruction
}

@PART[opt_k_wrapIntake]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_hugeAirframe
}

//Wrap solar
@PART[opt_j_wrapPV,opt_k_wrapPV,opt_h_wrapPV]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_solar2
}

//RCS
@PART[opt_inlineMk2_rcs,opt_inlineS2_rcs]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_stab
}

//Intake generators
@PART[opt_intakeSRAT]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_wind2
}

//Generator Bays
@PART[k_3m_genbay,kh_3m_genbay]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_hugeAirframe
}

@PART[j_4m_genbay]:NEEDS[zzGPTT]
{
	@TechRequired = gptt_heavyAirframeConstruction
}





