	showChangelog = True
	modName = OPT Reconfig
	
	VERSION
	{
		version = 3.4.9.6
		CHANGE
		{
			type = Add
			change = Added GPTT configs thanks to player Davidinc2008.
			change = Added/Updated fuel selection on power drum.
			change = Added/Updated FAR and Kerbal Actuators detection for tilt engines.
		}
		CHANGE
		{
