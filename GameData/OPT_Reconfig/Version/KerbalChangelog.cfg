			change = Added System Heat radiator configs.
			change = Added WarpJet Isp selector based on Near Future Propulsion's PIT tuner.
		}
		CHANGE
		{
			type = Change
			change = Received all patches and sounds from the parts packs.
			change = Reduced the RO configs a bit. Treat it as less stable, less complete.
			change = Updated Antimatter configs so containment cost only applies when tanks are set to hole Antimatter.
			change = Updated boiloff configs to cater for more resources.
			change = Updated WBI OmniStorage (tank switcher) config to be optional extra (for players who want WBI Pathfinder but not this effect).
		}
