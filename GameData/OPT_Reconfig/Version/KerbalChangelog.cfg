			change = Changed fusion fuel options to require Rational Resources, not FFT.
			change = Updated System Heat on generator bays. They are justified as containing supercritical CO2 turbines.
		}
		CHANGE
		{
			type = Fix
			change = Fixed detection issue on variant selector for the Egg Dog engine.
			change = Removed water as an option for propellant. (Now only available if certain life support mods installed.) Fix issue with 2 B9PS modules managining the same resource.
			change = Updated RR engine families patch. Fixed issue with engines that ask for IntakeAtm.
			change = Updated dependence from WildBlueTools to WBIResources.
		}
	}
	VERSION
	{
		version = 3.4.9.5
		CHANGE
		{
			type = Change
			change = Updated System Heat config to cover belt radiators.
			change = Updated Kerbal Actuators config to remove the elevon module from tilt engines. Fixes potential overlap conflict issues.
			change = Fixed Kerbal Actuators config pointing to OPT Legacy for the alternate models for the Slipstream engine (RCS) and Skylight tilt engine. Affected engines became invalid and would not appear.
		}
		CHANGE
		{
			type = Change
			change = Updated System Heat configs for thermal nozzle engines and reactors:
			subchange = Dark Energy power spheres now count as Sterling Systems style pebble bed reactors (fission type, no longer fusion).
			subchange = Affected engines produce 1/10 the previous amounts of waste heat.
			subchange = LP-R Irradiance engine now counts as a thermal nozzle.
		}
	}
