//Stack intakes
@PART[mk2_ramIntake|opt_s2intake]:NEEDS[ClassicStock]
{
	+MODULE[ModuleResourceIntake]:HAS[#resourceName[IntakeAir]]
	{
		@resourceName = Atmosphere
		%checkForOxygen = false
	}
	+RESOURCE[IntakeAir]
	{
		@name = Atmosphere
	}
}

// J-81 Nacelle, Bubble, Wrapper VTOL engines
@PART[j81turbojet|opt_vtol_bubble1|opt_vtol_wrap?1]:NEEDS[ClassicStock]
{
	+MODULE[ModuleResourceIntake]:HAS[#resourceName[IntakeAir]]
	{
		@resourceName = Atmosphere
		%checkForOxygen = false
	}
	+RESOURCE[IntakeAir]
	{
		@name = Atmosphere
	}
	@MODULE[ModuleEnginesFX],*
	{
		@PROPELLANT[IntakeAir]
		{
			@name = Atmosphere
		}
	}
	@MODULE[ModuleResourceIntake]:HAS[#resourceName[IntakeAir]]
	{
		@checkForOxygen = True
	}
}

// Rudder
@PART[opt_vtol_rudder1]:NEEDS[ClassicStock]
{
	+MODULE[ModuleResourceIntake]:HAS[#resourceName[IntakeAir]]
	{
		@resourceName = Atmosphere
		%checkForOxygen = false
	}
	+RESOURCE[IntakeAir]
	{
		@name = Atmosphere
	}
	+RESOURCE[IntakeAir]
	{
		@name = CompressedAtmosphere
	}
	@MODULE[ModuleEnginesFX]
	{
		@PROPELLANT[IntakeAir]
		{
			@name = Atmosphere
		}
	}
	@MODULE[ModuleRCSFX]
	{
		@resourceName = CompressedAtmosphere
	}
	MODULE
	{
		name = ModuleAlternator
		engineName = WJOpen
		outputName = Compressor (Open)
		outputUnits = CAtm/s
		RESOURCE
		{
			name = CompressedAtmosphere
			rate = 2
		}
	}
}

// WarpJet engines
@PART[opt_sage|opt_vtol_wrap?2|opt_vtol_jump?2]:NEEDS[ClassicStock]
{
	+MODULE[ModuleResourceIntake]:HAS[#resourceName[IntakeAir]]
	{
		@resourceName = Atmosphere
		%checkForOxygen = false
	}
	+RESOURCE[IntakeAir]
	{
		@name = Atmosphere
	}
	+RESOURCE[IntakeAir]
	{
		@name = CompressedAtmosphere
	}
	@MODULE[ModuleEnginesFX],*
	{
		@PROPELLANT[IntakeAir]
		{
			@name = Atmosphere
		}
	}
	MODULE
	{
		name = ModuleAlternator
		engineName = WJOpen
		outputName = Compressor (Open)
		outputUnits = CAtm/s
		RESOURCE
		{
			name = CompressedAtmosphere
			rate = 10
		}
	}
	MODULE
	{
		name = ModuleAlternator
		engineName = WJClosed
		outputName = Compressor (Closed)
		outputUnits = CAtm/s
		RESOURCE
		{
			name = CompressedAtmosphere
			rate = 4
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[DynoTune]]
	{
		@SUBTYPE,*
		{
			@MODULE
			{
				@DATA
				{
					@PROPELLANT[IntakeAir]
					{
						@name = Atmosphere
					}
				}
			}
		}
	}
}

@PART[opt_surge]:NEEDS[ClassicStock]
{
	+MODULE[ModuleResourceIntake]
	{
		@resourceName = Atmosphere
		%checkForOxygen = false
	}
	+RESOURCE[IntakeAir]
	{
		@name = Atmosphere
		@amount = 400
		@maxAmount = 400
	}
	+RESOURCE[IntakeAir]
	{
		@name = CompressedAtmosphere
	}
	MODULE
	{
		name = ModuleAlternator
		engineName = WJOpen
		outputName = Compressor (Open)
		outputUnits = CAtm/s
		RESOURCE
		{
			name = CompressedAtmosphere
			rate = 30
		}
	}
	@MODULE[ModuleEnginesFX]
	{
		@PROPELLANT[IntakeAir]
		{
			@name = Atmosphere
		}
	}
}

// Discrete Intakes
@PART[mk2_ramIntake]:NEEDS[ClassicStock]
{
	MODULE
	{
		name = WBIOmniConverter
		ConverterName = Atmosphere Compressor
		StartActionName = Start Atmosphere Compressor
		StopActionName = Stop Atmosphere Compressor
		FillAmount = 1.0
		AutoShutdown = true
		GeneratesHeat = false
		INPUT_RESOURCE
		{
			ResourceName = Atmosphere
			Ratio = 7.5
			FlowMode = ALL_VESSEL
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 22.5
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = CompressedAtmosphere
			Ratio = 1.5
		}
	}
}
@PART[opt_s2intake]:NEEDS[ClassicStock]
{
	MODULE
	{
		name = WBIOmniConverter
		ConverterName = Atmosphere Compressor
		StartActionName = Start Atmosphere Compressor
		StopActionName = Stop Atmosphere Compressor
		FillAmount = 1.0
		AutoShutdown = true
		GeneratesHeat = false		 
		INPUT_RESOURCE
		{
			ResourceName = Atmosphere
			Ratio = 10
			FlowMode = ALL_VESSEL
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 30
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = CompressedAtmosphere
			Ratio = 2
		}
	}
}
