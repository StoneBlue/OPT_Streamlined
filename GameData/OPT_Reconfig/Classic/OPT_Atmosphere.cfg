// Cockpit intakes
@PART[b_cockpit_qs,j_cockpit_qs,j_6m_cockpit]:NEEDS[ClassicStock]
{
	+MODULE[ModuleResourceIntake]
	{
		@resourceName = Atmosphere
		%checkForOxygen = false
	}
	+RESOURCE[IntakeAir]
	{
		@name = Atmosphere
	}
}
