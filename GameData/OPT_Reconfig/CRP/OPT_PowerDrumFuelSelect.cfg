@PART[opt_powerdrum]:NEEDS[CommunityResourcePack,!SystemHeat]
{
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Fusion Reactor
		StartActionName = Start Fusion Reactor
		StopActionName = Stop Fusion Reactor
		ToggleActionName = Toggle Fusion Reactor
		GeneratesHeat = true
		UseSpecialistBonus = false
		AutoShutdown = true
		resourceOutputName = ThermalPower
		TemperatureModifier
		{
			key = 0 473000 0 0
			key = 1300 141900 0 0
			key = 1301 0
		}
		ThermalEfficiency
		{
			key = 0 0
			key = 700 0.1 0.0002361563 0.0002361563
			key = 1000 0.3
			key = 1300 1 0 0
			key = 1600 0.2
			key = 2000 0 0 0
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdDeuterium
			Ratio = 2.18E-06
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdHe3
			Ratio = 8.72E-06
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 7000
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 1000
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
	}
}
@PART[opt_powerdrum]:NEEDS[CommunityResourcePack,SystemHeat]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/mass$
		moduleID = nuke
		iconName = Icon_Nuke
		ignoreTemperature = true
	}
	
	MODULE
	{
		name = ModuleSystemHeatConverter
		moduleID = fusionreactor
		systemHeatModuleID = nuke
		shutdownTemperature = 1800
		systemOutletTemperature = 1600
		systemPower = 6000
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		ConverterName = Fusion Reactor
		StartActionName = Start Reactor
		StopActionName = Stop Reactor
		ToggleActionName = Toggle Reactor
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = False
		resourceOutputName = ElectricCharge
		INPUT_RESOURCE
		{
			ResourceName = LqdDeuterium
			Ratio = 2.18E-06
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdHe3
			Ratio = 8.72E-06
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 7000
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 1000
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
	}
}

@PART[opt_powerdrum]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = FuelSelect
		switcherDescription = Fuel 
		switcherDescriptionPlural = Fuel Selections
		switchInFlight = True
		SUBTYPE
		{
			name = DHe
			title = D + 3He
			primaryColor = ResourceColorLiquidFuel
			secondaryColor = ResourceColorOxidizer
			descriptionSummary = Deuterium + Helium-3
			descriptionDetail = <b>Inputs:</b> 0.0078 D/hr + 0.3139 3He/hr <br><b>Outputs:</b> 7000 EC/s + 1000 ThP/s <br><color="orange">Please quicksave + quickload after applying.</color>
		}
		SUBTYPE
		{
			name = DD
			title = D + D
			primaryColor = ResourceColorLiquidFuel
			secondaryColor = ResourceColorOxidizer
			descriptionSummary = Deuterium + Deuterium
			descriptionDetail = <b>Inputs:</b> 0.0392 D/hr <br><b>Outputs:</b> 3000 EC/s + 500 ThP/s <br><color="orange">Please quicksave + quickload after applying.</color>
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
					@name:NEEDS[SystemHeat] = ModuleSystemHeatConverter
					ConverterName = Fusion Reactor
				}
				DATA
				{
					INPUT_RESOURCE
					{
						ResourceName = LqdDeuterium
						Ratio = 0.0000109
						FlowMode = STAGE_PRIORITY_FLOW
					}
					OUTPUT_RESOURCE
					{
						ResourceName = ElectricCharge
						Ratio = 3000
						DumpExcess = True
						FlowMode = ALL_VESSEL
					}
					OUTPUT_RESOURCE
					{
						ResourceName = ThermalPower
						Ratio = 500
						DumpExcess = True
						FlowMode = ALL_VESSEL
					}
				}
			}
		}
	}
}