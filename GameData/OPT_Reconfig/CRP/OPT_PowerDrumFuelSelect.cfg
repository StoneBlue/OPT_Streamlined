@PART[opt_powerdrum]:NEEDS[CommunityResourcePack,!SystemHeat]
{
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Fusion Reactor
		StartActionName = Start Fusion Reactor
		StopActionName = Stop Fusion Reactor
		ToggleActionName = Toggle Fusion Reactor
		GeneratesHeat = true
		UseSpecialistBonus = false
		AutoShutdown = true
		resourceOutputName = ThermalPower
		TemperatureModifier
		{
			key = 0 473000 0 0
			key = 1300 141900 0 0
			key = 1301 0
		}
		ThermalEfficiency
		{
			key = 0 0
			key = 700 0.1 0.0002361563 0.0002361563
			key = 1000 0.3
			key = 1300 1 0 0
			key = 1600 0.2
			key = 2000 0 0 0
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdDeuterium
			Ratio = 2.597E-06
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdHe3
			Ratio = 1.039E-05
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 6000
			@Ratio *= #$/refPower$
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 400
			@Ratio *= #$/refPower$
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
	}
}
@PART[opt_powerdrum]:NEEDS[CommunityResourcePack,SystemHeat]
{
	!MODULE[ModuleOverheatDisplay] {}
	!MODULE[ModuleCoreHeat] {}
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/mass$
		moduleID = nuke
		iconName = Icon_Nuke
		ignoreTemperature = true
	}
	
	MODULE
	{
		name = ModuleSystemHeatConverter
		moduleID = fusionreactor
		systemHeatModuleID = nuke
		shutdownTemperature = 1800
		systemOutletTemperature = 1600
		systemPower = 16000
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		ConverterName = Fusion Reactor
		StartActionName = Start Reactor
		StopActionName = Stop Reactor
		ToggleActionName = Toggle Reactor
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = False
		resourceOutputName = ElectricCharge
		INPUT_RESOURCE
		{
			ResourceName = LqdDeuterium
			Ratio = 2.597E-06
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdHe3
			Ratio = 1.039E-05
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 6000
			@Ratio *= #$/refPower$
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 400
			@Ratio *= #$/refPower$
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
	}
}

@PART[opt_powerdrum]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = FuelSelect
		switcherDescription = Fuel 
		switcherDescriptionPlural = Fuel Selections
		// switchInFlight = True
		SUBTYPE
		{
			name = DHe
			title = D + 3He
			primaryColor = PowderBlue
			secondaryColor = CloudyBlue
			descriptionSummary = Deuterium + Helium-3
			descriptionDetail = <b>Inputs:</b> 0.0094 D/hr + 0.0374 3He/hr <br><b>Outputs:</b> 6000 EC/s + 400 ThP/s <br><b>System Heat:</b> <#FF5D35>16 MW</color>. <br><color="orange">Please quicksave + quickload after applying.</color>
		}
		SUBTYPE
		{
			name = DT
			title = D + T
			primaryColor = PowderBlue
			// secondaryColor = PowderBlue
			descriptionSummary = Deuterium + Tritium
			descriptionDetail = <b>Inputs:</b> 0.0112 D/hr + 0.0056 T/hr <br><b>Outputs:</b> 2050 EC/s + 6000 ThP/s <br><b>System Heat:</b> <#FF5D35>6.07 MW</color>. <br><color="orange">Please quicksave + quickload after applying.</color>
			defaultSubtypePriority = 1
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
					@name:NEEDS[SystemHeat] = ModuleSystemHeatConverter
					ConverterName = Fusion Reactor
				}
				DATA
				{
					systemPower:NEEDS[SystemHeat] = 6070
					INPUT_RESOURCE
					{
						ResourceName = LqdDeuterium
						Ratio = 3.1069E-06
						@Ratio *= #$/refPower$
						FlowMode = STAGE_PRIORITY_FLOW
					}
					INPUT_RESOURCE
					{
						ResourceName = LqdTritium
						Ratio = 1.5534E-06
						@Ratio *= #$/refPower$
						FlowMode = STAGE_PRIORITY_FLOW
					}
					OUTPUT_RESOURCE
					{
						ResourceName = ElectricCharge
						Ratio = 2050
						@Ratio *= #$/refPower$
						DumpExcess = True
						FlowMode = ALL_VESSEL
					}
					OUTPUT_RESOURCE
					{
						ResourceName = ThermalPower
						Ratio = 6000
						@Ratio *= #$/refPower$
						DumpExcess = True
						FlowMode = ALL_VESSEL
					}
				}
			}
		}
		SUBTYPE
		{
			name = DD1
			title = D + D (-> T)
