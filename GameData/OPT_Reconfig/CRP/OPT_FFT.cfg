@PART:HAS[#manufacturer[OPT*Division],@MODULE[ModuleB9PartSwitch],#TankTag[OPT*]]:NEEDS[zKerbalismFFT]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[OPT*]]
	{
		@SUBTYPE[AM]
		{
			@MODULE
			{
				@IDENTIFIER
				{
					@name = FFTModuleAntimatterTankKerbalism
				}
			}
		}
	}
	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismFFT_Brokers_AntimatterTank
		considered = true
	}
}
