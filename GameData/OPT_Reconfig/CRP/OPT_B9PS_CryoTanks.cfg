@PART:HAS[#manufacturer[OPT*Division],@MODULE[ModuleB9PartSwitch]:HAS[#baseVolume]]:NEEDS[B9PartSwitch,CryoEngines|KerbalAtomics,!Pathfinder,!ModularFuelTanks,!RealFuels]
{
	MODULE:NEEDS[SimpleBoilOff]
	{
		name = ModuleCryoTank
		BOILOFFCONFIG
		{
			FuelName = LqdAmmonia
			BoiloffRate = 0.0035
			CoolingCost = 0.010
		}
		BOILOFFCONFIG
		{
			FuelName = LqdCO
			BoiloffRate = 0.04
			CoolingCost = 0.04
		}
		BOILOFFCONFIG
		{
			FuelName = LqdCO2
			BoiloffRate = 0.005
			CoolingCost = 0.015
		}
		BOILOFFCONFIG
		{
			FuelName = LqdDeuterium
			BoiloffRate = 0.05
			CoolingCost = 0.08
		}
		BOILOFFCONFIG
		{
			FuelName = LqdHe3
			BoiloffRate = 0.05
			CoolingCost = 0.08
		}
		BOILOFFCONFIG
		{
			FuelName = LqdHydrogen
			BoiloffRate = 0.05
			CoolingCost = 0.05
		}
		BOILOFFCONFIG
		{
			FuelName = LqdMethane
			BoiloffRate = 0.005
			CoolingCost = 0.02
		}
		BOILOFFCONFIG
		{
			FuelName = LqdNitrogen
			BoiloffRate = 0.04
			CoolingCost = 0.03
		}
		BOILOFFCONFIG
		{
			FuelName = LqdOxygen
			BoiloffRate = 0.04
			CoolingCost = 0.03
		}
	}
	
	// Cabins
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[OPTcabin]]:NEEDS[!RationalResources]
	{
		SUBTYPE
		{
			name = LH2
			tankType = OPTLH2
			title = OPT LH2
		}
		SUBTYPE
		{
			name = HLOX
			tankType = OPTLH2O
			title = OPT Hydrolox
		}
		SUBTYPE
		{
			name = LCH4
			tankType = LM
			title = #LOC_CryoTanks_switcher_fuel_methane
		}
		SUBTYPE
		{
			name = MLOX
			tankType = LMOx
			title = #LOC_CryoTanks_switcher_fuel_methalox
		}
	}
	
	// Inline SAS/RCS devices
