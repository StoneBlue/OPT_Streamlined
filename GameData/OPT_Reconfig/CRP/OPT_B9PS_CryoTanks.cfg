// New tank types

B9_TANK_TYPE:NEEDS[CommunityResourcePack]
{
	name = OPTLH2O
	tankMass = 0
	tankCost = 0.4

	RESOURCE
	{
		name = LqdHydrogen
		unitsPerVolume = 7.5
	}
	RESOURCE
	{
		name = Oxidizer
		unitsPerVolume = 0.5
	}
}
B9_TANK_TYPE:NEEDS[CommunityResourcePack]
{
	name = OPTLH2
	tankMass = 0
	tankCost = 0.25

	RESOURCE
	{
		name = LqdHydrogen
		unitsPerVolume = 15
	}
}

