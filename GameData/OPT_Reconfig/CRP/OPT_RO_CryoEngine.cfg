// # Closed Cycle

// Wrappers
// Valkyrie tilt
// J Linear Aerospike
// Stail Linear Aerospike
@PART[opt_vtol_wrap?1|opt_vtol_jump?1]:NEEDS[RealismOverhaul|RealFuels]
{
	@MODULE[ModuleEnginesFX]:HAS[@PROPELLANT[Oxidizer]],*
	{
		@minThrust:NEEDS[RealismOverhaul] = #$maxThrust$
		@minThrust:NEEDS[RealismOverhaul] *= 0.4
		%ignitions = 0
		%ullage = True
	}
}
@PART[?_linear_aerospike]:NEEDS[RealismOverhaul|RealFuels]
{
	@MODULE[ModuleEnginesFX]
	{
		@minThrust:NEEDS[RealismOverhaul] = #$maxThrust$
		@minThrust:NEEDS[RealismOverhaul] *= 0.2
		%ignitions = 20
		%ullage = True
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 22
		}
	}
}

