// HAE-02 (Short Mk2) High Altitude Turboramjet
// J-61 Turboramjet
// J-92 Nebula Shcramjet
// J-60 ScreamJet
// J-60D Hybrid ScreamJet
@PART[opt_mk2_engine_short,J61,opt_nebula_engine,turboRamJetj_60|turboRamJetj_60d]:NEEDS[RealismOverhaul|RealFuels]
{
	@MODULE[ModuleEnginesFX],0
	{
		%ignitions = 0
	}
}
@PART[opt_nebula_engine]:NEEDS[RealismOverhaul|RealFuels]
{
	@MODULE[ModuleEnginesFX],1
	{
		@minThrust:NEEDS[RealismOverhaul] = #$maxThrust$
		@minThrust:NEEDS[RealismOverhaul] *= 0.4
		%ignitions = 0
	}
}


