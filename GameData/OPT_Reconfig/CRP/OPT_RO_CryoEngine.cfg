// ARI-73 LF Engine
@PART[arie73]:NEEDS[RealismOverhaul|RealFuels]
{
	@MODULE[ModuleEnginesFX]:HAS[#engineID[Air-augmented]]
	{
		@minThrust:NEEDS[RealismOverhaul] = #$maxThrust$
		@minThrust:NEEDS[RealismOverhaul] *= 0.3
		%chamberNominalTemp = 2500
		%maxEngineTemp = 2700
		ignitions = 40
		%ullage = True
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdHydrogen
		}
		PROPELLANT
		{
			name = EnrichedUranium
			ratio = 0.00000000001
		}
	}
	@MODULE[ModuleEnginesFX]:HAS[#engineID[Standard]]
	{
		@minThrust:NEEDS[RealismOverhaul] = #$maxThrust$
		@minThrust:NEEDS[RealismOverhaul] *= 0.4
		%chamberNominalTemp = 2500
		%maxEngineTemp = 2700
		ignitions = 40
		%ullage = True
		PROPELLANT
		{
			name = EnrichedUranium
			ratio = 0.00000000001
		}
	}
	RESOURCE
	{
		name = EnrichedUranium
		amount = 3
		maxAmount = 3
	}
	RESOURCE
	{
		name = DepletedUranium
		amount = 0
		maxAmount = 3
	}
}

