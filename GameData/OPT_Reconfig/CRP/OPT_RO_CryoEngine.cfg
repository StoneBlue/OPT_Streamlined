// # Closed Cycle

// Wrappers
// Valkyrie tilt
// Helicarrier
// J Linear Aerospike
// Stail Linear Aerospike
@PART[opt_vtol_wrap?1|opt_vtol_jump?1|opt_vtol_hc1|j_linear_aerospike|b_linear_aerospike]:NEEDS[RealismOverhaul|RealFuels]
{
	@MODULE[ModuleEnginesFX]:HAS[@PROPELLANT[Oxidizer]]
	{
		@minThrust:NEEDS[RealismOverhaul] = #$maxThrust$
		@minThrust:NEEDS[RealismOverhaul] *= 0.2
		%ignitions = 0
		%ullage = True
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdHydrogen
			@ratio = 74.542277
			%resourceFlowMode = STACK_PRIORITY_SEARCH
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 25.457723
			%resourceFlowMode = STACK_PRIORITY_SEARCH
		}
		@atmosphereCurve
		{
			@key,*[1, ] *= 1.5
		}
	}
}
@PART[j_linear_aerospike|b_linear_aerospike]:NEEDS[RealismOverhaul|RealFuels]
{
	@MODULE[ModuleEnginesFX]
	{
		%ignitions = 12
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 22
		}
	}
}

