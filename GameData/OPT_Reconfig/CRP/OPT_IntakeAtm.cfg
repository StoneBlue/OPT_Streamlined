//Add IntakeAtm to all intakes if Mk2 Expansion is not installed as Mk2 Expansion will also do this
@PART:HAS[@RESOURCE[IntakeAir],!RESOURCE[IntakeAtm]]:NEEDS[CommunityResourcePack,!ClassicStock]
{
	+MODULE[ModuleResourceIntake]:HAS[#resourceName[IntakeAir]]
	{
		@resourceName = IntakeAtm
		%checkForOxygen = false
	}
	+RESOURCE[IntakeAir]
	{
		@name = IntakeAtm
	}
}

// ARI engines
@PART[AAengine|arie73]:NEEDS[CommunityResourcePack,!ClassicStock]:AFTER[OPT_Legacy]
{
	@MODULE[ModuleEnginesFX],0
	{
		@PROPELLANT[IntakeAir]
		{
			@name = IntakeAtm
		}
	}
}

// J-81 Nacelle, Bubble, Wrapper VTOL engines
@PART[j81turbojet|opt_vtol_bubble1|opt_vtol_wrap?1]:NEEDS[CommunityResourcePack,!ClassicStock]:AFTER[OPT_Legacy]
{
	@MODULE[ModuleEnginesFX],*
	{
		@PROPELLANT[IntakeAir]
		{
			@name = IntakeAtm
		}
	}
	@MODULE[ModuleResourceIntake]:HAS[#resourceName[IntakeAir]]
	{
		@checkForOxygen = True
	}
}

//WarpJet engines
@PART[opt_sage|opt_vtol_wrap?2|opt_vtol_jump?2]:NEEDS[CommunityResourcePack,!ClassicStock]:AFTER[OPT_Legacy]
{
	@MODULE[ModuleEnginesFX],*
	{
		@PROPELLANT[IntakeAir]
		{
			@name = IntakeAtm
		}
	}
	@MODULE[ModuleResourceIntake]:HAS[#resourceName[IntakeAir]]
	{
		@checkForOxygen = True
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[DynoTune]]
	{
		@SUBTYPE,*
		{
			@MODULE
			{
				@DATA
				{
					@PROPELLANT[IntakeAir]
					{
						@name = IntakeAtm
					}
				}
			}
		}
	}
}

@PART[opt_surge]:NEEDS[CommunityResourcePack,!ClassicStock]
{
	@RESOURCE[IntakeAtm]
	{
		@amount = 400
		@maxAmount = 400
	}
	@MODULE[ModuleResourceIntake]:HAS[#resourceName[IntakeAir]]
	{
		@checkForOxygen = True
	}
	@MODULE[ModuleEnginesFX]
	{
		@PROPELLANT[IntakeAir]
		{
			@name = IntakeAtm
		}
	}
}
@PART[opt_vtol_wrap?2|opt_vtol_jump?2]:NEEDS[CommunityResourcePack,!ClassicStock]
{
	@MODULE[ModuleEnginesFX],*
	{
		@PROPELLANT[IntakeAir]
		{
			@name = IntakeAtm
		}
	}
	@RESOURCE[IntakeAtm]
	{
		@amount *= 10
		@maxAmount *= 10
	}
}
@PART[opt_vtol_rudder*]:NEEDS[CommunityResourcePack,!ClassicStock]
{
	@MODULE[ModuleEnginesFX]:HAS[#engineID[FanElectric]]
	{
		@PROPELLANT[IntakeAir]
		{
			@name = IntakeAtm
			DrawGauge = True
		}
	}
	@MODULE[ModuleRCSFX]
	{
		@resourceName = IntakeAtm
	}
}
@PART[opt_vtol_heli*|opt_vtol_lpj1]:NEEDS[CommunityResourcePack,!ClassicStock]
{
	@MODULE[ModuleEnginesFX]:HAS[#engineID[FanElectric]]
	{
		@PROPELLANT[IntakeAir]
		{
			@name = IntakeAtm
			DrawGauge = True
		}
	}
}

@PART[opt_intakeLinear]:NEEDS[B9PartSwitch,CommunityResourcePack,!ClassicStock]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[Width]]
	{
		@SUBTYPE[w2]
		{
			+MODULE,0
			{
				@IDENTIFIER
				{
					@resourceName = IntakeAtm
				}
			}
			+RESOURCE[IntakeAir]
			{
				@name = IntakeAtm
			}
		}
		@SUBTYPE[w3]
		{
			+MODULE,0
			{
				@IDENTIFIER
				{
					@resourceName = IntakeAtm
				}
			}
			+RESOURCE[IntakeAir]
			{
				@name = IntakeAtm
			}
		}
		@SUBTYPE[w4]
		{
			+MODULE,0
			{
				@IDENTIFIER
				{
					@resourceName = IntakeAtm
				}
			}
			+RESOURCE[IntakeAir]
			{
				@name = IntakeAtm
			}
		}
	}
}