		name = ModuleB9PartSwitch
		moduleID = coreNodes
		switcherDescription = Payload Nodes
		switcherDescriptionPlural = Payload Node Selections
		SUBTYPE
		{
			name = Default
			descriptionSummary = All.
			node = top01
			node = top02
			node = bottom01
			node = bottom02
		}
		SUBTYPE
		{
			name = Top
			descriptionSummary = Top only.
			node = top01
			node = top02
		}
		SUBTYPE
		{
			name = Bottom
			descriptionSummary = Bottom only.
			node = bottom01
			node = bottom02
		}
	}
}

@PART:HAS[#manufacturer[OPT*Division],#CrewCapacity[>0]] // :NEEDS[TacLifeSupport|USILifeSupport|SnacksUtils|Kerbalism,ProfileDefault]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = OPTLS
		switcherDescription = OPT LS
		switcherDescriptionPlural = LS Selections
		switchInFlight = True
		baseVolume = #$../CrewCapacity$
		@baseVolume *= 4
		SUBTYPE
		{
			name = Structural
			title = Structural
			switchInFlight = True
		}
	}
}

// =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  

// Wrapper solar panels
@PART[opt_?_wrapPV]
{
	@MODULE[ModuleB9PartSwitch]
	{
		@SUBTYPE,0
		{
			descriptionSummary = #Charge per side: $/refPower$ EC/s
		}
		@SUBTYPE,1
		{
			descriptionSummary = #Charge per side: $/refPower2$ EC/s
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleDeployableSolarPanel
					secondaryTransformName = sunCatcher1
				}
				DATA
				{
					chargeRate = #$/refPower2$
				}
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleDeployableSolarPanel
					secondaryTransformName = sunCatcher2
				}
				DATA
				{
					chargeRate = #$/refPower2$
				}
			}
		}
	}
}

// =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  

// Wrapper radiators
@PART[opt_?_wrapRad?]
{
	@MODULE[ModuleB9PartSwitch]
	{
		@SUBTYPE,0
		{
			descriptionSummary = #<b>Energy Transfer</b>: $/refPower$ kW
		}
		@SUBTYPE,1
		{
			descriptionSummary = #<b>Energy Transfer</b>: $/refPower2$ kW
		}
		@SUBTYPE,1:NEEDS[!SystemHeat]
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleActiveRadiator
				}
				DATA
				{
					maxEnergyTransfer = #$/refPower2$
					@maxEnergyTransfer *= 50
					RESOURCE
					{
						name = ElectricCharge
						rate = #$/refECReq$
						@rate *= 2
					}
				}
			}
		}
	}
}