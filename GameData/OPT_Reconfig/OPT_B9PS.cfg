// =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  =  
@PART:HAS[#manufacturer[OPT*Division],#refVolume[*],~TankTag[OPTlab],~TankTag[OPTgen]]:NEEDS[B9PartSwitch,!ConfigurableContainers/Parts,!ModularFuelTanks,!RealFuels]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = #$../TankTag$
		switcherDescription = OPT Tank
		switcherDescriptionPlural = Tank Selections
		switchInFlight = True
		baseVolume = #$../refVolume$
	}
}

