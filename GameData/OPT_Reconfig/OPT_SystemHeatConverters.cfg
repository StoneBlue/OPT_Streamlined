@PART[opt_powersphere1b|opt_powersphere2]:NEEDS[SystemHeatConverters]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/mass$
		moduleID = nuke
		iconName = Icon_Nuke
		ignoreTemperature = true
	}
	
	@MODULE[ModuleResourceConverter],0
	{
		@name = ModuleSystemHeatConverter
		systemHeatModuleID = nuke
		shutdownTemperature = 1300
		systemOutletTemperature = 1100
		@GeneratesHeat = false
		systemPower = 606.9 // 0.05% net energy wasted
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		@OUTPUT_RESOURCE,1
		{
			@Ratio = 1213.19 // 99.95% net energy
		}
		!TemperatureModifier {}
		!ThermalEfficiency {}
	}
	@MODULE[ModuleResourceConverter],1
	{
		@name = ModuleSystemHeatConverter
		systemHeatModuleID = nuke
		shutdownTemperature = 1300
		systemOutletTemperature = 1100
		@GeneratesHeat = false
		systemPower = 178.5
		systemEfficiency
		{
			key = 0 0
			key = 350 0.1 0.0004 0.002
			key = 650 1
		}
		!TemperatureModifier {}
		!ThermalEfficiency {}
	}
	!MODULE[ModuleCoreHeat] {}
	!MODULE[ModuleOverheatDisplay] {}
}

@PART[opt_powersphere2]:NEEDS[SystemHeatConverters]
{
	@MODULE[ModuleSystemHeatConverter],0
	{
		@systemPower = 4824.6
		@OUTPUT_RESOURCE,1
		{
			@Ratio = 9644.375
		}
	}
	@MODULE[ModuleSystemHeatConverter],1
	{
		@systemPower = 1419
	}
}

@PART[j_4m_genbay|k_3m_genbay|kh_3m_genbay]:NEEDS[CommunityResourcePack,SystemHeatConverters]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/refVolume$
		@volume *= 0.04
		moduleID = isru
		iconName = Icon_Gears
		ignoreTemperature = true
	}
	MODULE
	{
		name = ModuleSystemHeatConverter
		moduleID = Thermoelectric Converter
		systemHeatModuleID = isru
		shutdownTemperature = 1000
		systemOutletTemperature = 650 // temp for freeing water from hydrate regolith. other values could be: 400k for production of hydrazine, 5-600k for decomposition of hydrates, 700 for sabatier process, 373-1000k for high temp electrolysis of water.
		systemPower = 1200
		@systemPower *= #$/refPower$
		systemEfficiency
		{
			key = 0 0
			key = 350 0.1 0.0004 0.002
			key = 650 1
		}
		ConverterName = Thermoelectric Converter
		StartActionName = #autoLOC_235502 // Activate Generator
		StopActionName = #autoLOC_235505 // Shutdown Generator
		ToggleActionName = #autoLOC_235508 // Toggle Generator
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = False
		INPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 2.4
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1200
			@Ratio *= #$/refPower$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
	}
	!MODULE[ModuleResourceConverter] {}
	!MODULE[ModuleCoreHeat] {}
	!MODULE[ModuleOverheatDisplay] {}
}