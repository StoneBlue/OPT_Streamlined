PART
{
	// --- general parameters ---
	name = ils_cockpit_mki
	module = Part
	author = K.Yeon
	tags = opt size2


	// --- asset parameters ---
	scale = 1
	rescaleFactor = 1
	
	MODEL
	{
		model = OPT_Legacy/Parts/MiscParts/Size_2/OPT_i_5m_cockpit_ils
	}


	// --- node definitions ---
	// definition format is Position X, Position Y, Position Z, Up X, Up Y, Up Z
	node_stack_bottom = 0.0, -1.98935, 0.0, 0.0, -1.0, 0.0, 2


	// --- editor parameters ---
	TechRequired = highAltitudeFlight
	entryCost = 15000
	cost = 2750
	category = Pods
	subcategory = 0
	title = OPT 2.5m I-LS AA Cockpit Mk I 
	manufacturer = OPT Aerospace Division
	description = ILS cockpit is an experimental cockpit created by OPT in the early days of space flights. It uses advanced aerodynamic designs and high forward visability windows.


	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,0,1,1,0

	
	// --- standard part parameters ---
	mass = 2.594
	crashTolerance = 45
	breakingForce = 500
	breakingTorque = 500
	maxTemp = 2700
	emissiveConstant = 0.87
	thermalMassModifier = 5.0
	maxTemp = 1500
	skinMaxTemp = 2700
	dragModelType = default
	bulkheadProfiles = size2
	vesselType = Plane

	
	// --- internal setup ---
	CrewCapacity = 5

	INTERNAL
	{
		name = ILSCockpit
	}

	
	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
	}

	RESOURCE
	{
		name = ElectricCharge
		amount = 1500
		maxAmount = 1500
	}

	MODULE
	{
		name = ModuleReactionWheel
		actionGUIName = Toggle RW
		PitchTorque = 45
		YawTorque = 45
		RollTorque = 45
		
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.5
		}
	}
	
	MODULE
	{
		name = ModuleScienceExperiment	
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False	
		useActionGroups = True
		hideUIwhenUnavailable = True	
		rerunnable = True
		xmitDataScalar = 1.0
	}
	
	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 3.0
	}

	RESOURCE
	{
		name = MonoPropellant
		amount = 0
		maxAmount = 40
	}
	
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = light
		actionGUIName = Toggle Lights
		defaultActionGroup = Light
		startEventGUIName = Lights On
		endEventGUIName = Lights Off
	}
	
	MODULE
	{
		name = FlagDecal
		textureQuadName = Quad
	}
	
	MODULE
	{
		name = ModuleDataTransmitter
		antennaType = INTERNAL
		packetInterval = 1.0
		packetSize = 2
		packetResourceCost = 12.0
		requiredResource = ElectricCharge
		antennaPower = 5000
		optimumRange = 2500
		packetFloor = .1
		packetCeiling = 5
	}
}