PART
{
	name = opt_powersphere1b
	author = JadeOfMaar
	module = Part
	
	//descriptions
	
	title = #LOC_OPT_opt_powersphere1b_title
	manufacturer = #LOC_OPT_manufacturerP
	description = #LOC_OPT_opt_powersphere1b_desc
	bulkheadProfiles = size1,srf
	mass = 10
	tags = #LOC_OPT_tags_electricGoo
	
	//category, technology and cost
	category = Electrical
	subcategory = 0.0
	TechRequired = experimentalElectrics
	cost = 45600
	entryCost = 102000
	
	//temperatures
	// skinMaxTemp = 2000
	maxTemp = 2700
	emissiveConstant = 0.88 // rather great at radiating
	thermalMassModifier = 4.0
	skinInternalConductionMult = 2000
	emissiveConstant = 0.88
	heatConductivity = 0.001 // great insulation
	
	//tolerances
	crashTolerance = 20
	// breakingForce = 400
	// breakingTorque = 400
	
	MODEL
	{
		model = OPT_Legacy/Parts/MiscParts/Power/OPT_PowerSphere1b
		scale = 1, 1, 1
	}
	
	//scales
	rescaleFactor = 1.0
	
	//others
	attachRules = 1,1,1,0,0
	dragModelType = default
	fuelCrossFeed = True
	
	node_stack_bottom = 0.0, -0.55, 0.0, 0.0, -1.0, -0.0, 1
	node_attach = 0.0, -0.55, 0.0, 0.0, -1.0, -0.0, 1
	
	RESOURCE
	{
		name = ElectricCharge
		amount = 200
		maxAmount = 200
	}
	
	MODULE
	{
		name = ModuleAnimateHeat
		ThermalAnim = LEDheat
	}
	
	MODULE
	{
		name = ModuleOverheatDisplay
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Polywell Fusion
		StartActionName = Start Polywell Fusion
		StopActionName = Stop Polywell Fusion
		ToggleActionName = Toggle Polywell Fusion
		GeneratesHeat = True
		UseSpecialistBonus = false
		AutoShutdown = true
		TemperatureModifier
		{
			key = 0 100000 0 -112.46
			key = 1000 25000 -34.65 -34.65
			key = 3000 0
		}
		DefaultShutoffTemp = .8
		ThermalEfficiency 
		{
			key = 0 0 0 0
			key = 500 0.2
			key = 1000 1 0 0
			key = 1850 0.2
			key = 3000 0 0 0
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdDeuterium
			Ratio = 0.00062346
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdHe3
			Ratio = 0.003432204
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 900
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 9
			DumpExcess = True
		}
	}
	
	MODULE
	{
		name = ModuleAnimationGroup
		deployAnimationName = LEDinit
		activeAnimationName = LEDpulse
		deployActionName = Prime Reactor
		retractActionName = Rest Reactor
		toggleActionName = Toggle Reactor
		moduleType = #autoLOC_7001227 //Converter
		// autoDeploy = true
	}
		
	MODULE
	{
		name = ModuleCoreHeat
		CoreTempGoal = 1000					//Internal temp goal - we don't transfer till we hit this point
		CoreToPartRatio = 0.1				//Scale back cooling if the part is this % of core temp
		CoreTempGoalAdjustment = 0			//Dynamic goal adjustment
		CoreEnergyMultiplier = 0.1			//What percentage of our core energy do we transfer to the part
		HeatRadiantMultiplier = 0.05		//If the core is hotter, how much heat radiates?
		CoolingRadiantMultiplier = 0		//If the core is colder, how much radiates?
		HeatTransferMultiplier = 0			//If the part is hotter, how much heat transfers in?
		CoolantTransferMultiplier = 0.01	//If the part is colder, how much of our energy can we transfer?
		radiatorCoolingFactor = 1			//How much energy we pull from core with an active radiator?  >= 1
		radiatorHeatingFactor = 0.05		//How much energy we push to the active radiator
		MaxCalculationWarp = 1000			//Based on how dramatic the changes are, this is the max rate of change
		CoreShutdownTemp = 3000				//At what core temperature do we shut down all generators on this part?
		MaxCoolant = 1000					//Maximum amount of radiator capacity we can consume - 50 = 1 small
	}
}