		#LOC_OPT_h_wrapRadG_title = OPT H Wrapper Titanium Radiator
		#LOC_OPT_j_wrapRadG_title = OPT J Wrapper Titanium Radiator
		#LOC_OPT_k_wrapRadG_title = OPT K Wrapper Titanium Radiator
		#LOC_OPT_h_wrapRadW_title = OPT H Wrapper Low Temp Radiator
		#LOC_OPT_j_wrapRadW_title = OPT J Wrapper Low Temp Radiator
		#LOC_OPT_k_wrapRadW_title = OPT K Wrapper Low Temp Radiator
		#LOC_OPT_j_wrapIntake_title = OPT J Wrapper Ram Intake
		#LOC_OPT_k_wrapIntake_title = OPT K Wrapper Ram Intake
		
		#LOC_OPT_wrapRadB_desc = Since the development of the Dark Drive, there has been a surge in demand for high performance cooling systems. It's funny how we took this long to deliver on this. Seriously, we started laughing too long and crying actual rivers at the cost of producing the material.
		#LOC_OPT_wrapRadG_desc = There is quite a lot of ISRU that can be packed into a spaceplane but there isn't much ability to pack a lot of radiator area without becoming un-flyable. This panel seeks to address that major problem.
		#LOC_OPT_wrapRadW_desc = We love big spaceplanes and we love them being habitable in the long term. Part of the cost to maintain these is a radiator big enough and well-suited to keeping all the Hydrogen from phasing out of the tanks.
		#LOC_OPT_wrapPV_desc = Really big planes need really big batteries. And really big batteries need really big chargers.
		#LOC_OPT_wrapIntake_desc = Form-fitting air inlet for our fuselages. Due to its great area and space-age build, it's able to capture more air at higher speeds than other ram intakes. It has quite poor static suction, however, so be gentle with the throttle while grounded.
		
		// RCS
		#LOC_OPT_opt_oms_black_title = OPT Aerodynamic OMS
		#LOC_OPT_opt_rcs_black_title = OPT Button RCS Port
		#LOC_OPT_opt_retro_rcs_title = OPT Retro RCS Port
		#LOC_OPT_opt_inlineMk2_rcs_title = OPT Mk2 Inline RCS Unit
		#LOC_OPT_opt_inlineS2_rcs_title = OPT 2.5m Inline RCS Unit
		
		#LOC_OPT_opt_oms_black_desc = OPT's newest, most efficient, compact and aerodynamic 5 way RCS block. It's rather heavy. It additionally responds to throttle and provides forward thrust with its second RCS module. It requires a lot of electric charge to operate.
		#LOC_OPT_opt_rcs_black_desc = A very powerful and efficient single RCS, with extremely low profile. In black! It requires a lot of electric charge to operate..
		#LOC_OPT_opt_retro_rcs_desc = This was an prototype for the J-SL cockpit retro RCS. Might as well use it. It requires a lot of electric charge to operate.
		#LOC_OPT_opt_inlineMk2_rcs_desc = It doesn't get more aerodynamic than inline and fully recessed. We could have made this a bit longer and included tanks but then the pilot would need to take off more than his helmet to get to the cabin behind it.
		#LOC_OPT_opt_inlineS2_rcs_desc = Studies have shown that having protruding RCS nozzles are bad for aerodynamics, bad for themselves, and they deflect a significant portion of the airflow from reaching any intakes placed on the J to 2.5m adapter which usually follows our 2.5m cockpits.
		
		
		// Misc
		
		#LOC_OPT_intakeLinear_title = OPT Linear Ram Intake
		#LOC_OPT_intakeSRAT_title = OPT Supersonic Ram Air Turbine
		#LOC_OPT_intakeLinear_desc = Adjustable air inlet for large wings. Due to its great area and space-age build, it's able to capture more air at higher speeds than other ram intakes. It has quite poor static suction, however, so be gentle with the throttle while grounded.
		#LOC_OPT_intakeSRAT_desc = We've been getting reports of spaceplanes, even our own, running out of power on the reentry. Someone had the bright idea of putting a turbine behind a precooler and using the turbine not for thrust but to crank MAGNETS. It turned out to be very bright and very stable, except when Dimwatt Kerman used it to grill a load of cheese.
		
		#LOC_OPT_j_genbay_title = OPT J Generator Bay
		#LOC_OPT_k_genbay_title = OPT K Generator Bay
		#LOC_OPT_kh_genbay_title = OPT KH Generator Bay
		#LOC_OPT_genbay_desc = The generator bay accepts a compatible thermal power source and converters to generous amounts of ElectricCharge
		
