		#LOC_OPT_k_beltradiator_title = OPT K Graphene Belt Radiator
		#LOC_OPT_beltradiator_desc = With drums spinning at a blazing 12 Hz, this deployable radiator does the absolute best that can be done to dump lots of heat while still keeping a mostly solid form!
		
