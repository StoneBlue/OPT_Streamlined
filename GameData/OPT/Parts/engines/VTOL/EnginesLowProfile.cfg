// Chemical
+PART[opt_vtol_lpj1]
{
	@name = opt_vtol_lpr1
	@title = #LOC_OPT_opt_vtol_lpr1_title
	@cost = 1265
	@mass = 0.771
	@TechRequired = aerospaceTech
	@description = #LOC_OPT_opt_vtol_lpr1_desc
	@maxTemp = 2400
	@MODEL
	{
		@model = OPT/Parts/engines/VTOL/LP-R
	}
	@EFFECTS
	{
		!running_open {}
		!running_turbine {}
		!running_open2 {}
		!running_turbine2 {}
	}
	!MODULE[MultiModeEngine] {}
	@MODULE[ModuleEnginesFX],0
	{
		@engineID = ClosedCycle
		@ignitionThreshold = 0.01
		@maxThrust = 250
		@heatProduction = 90
		@useEngineResponseTime = False
		!engineAccelerationSpeed = 0.7
		!engineDecelerationSpeed = 0.35
		// @flameoutEffectName = flameout
		@powerEffectName = powersharp
		// @engageEffectName = engage
		// @disengageEffectName = disengage
		!spoolEffectName = running_turbine
		!engineSpoolIdle = 0.05
		!engineSpoolTime = 2.0
		@EngineType = LiquidFuel
		@PROPELLANT[LiquidFuel]
		{
			@ratio = 0.45
		}
		@PROPELLANT[IntakeAir]
		{
			@name = Oxidizer
			@ratio = 0.55
			%ignoreForIsp = False
			%DrawGauge = True
		}
		@atmosphereCurve
		{
			!key = nope
			key = 0 305
			key = 1 290
			key = 25 0.001
		}
		@atmChangeFlow = False
		@useVelCurve = False
		@useAtmCurve = False
		!velCurve {}
		!atmCurve {}
	}
	
	!MODULE[ModuleEnginesFX],1 {}
	@MODULE[ModuleGimbal]
	{
		@gimbalResponseSpeed = 4
		// @useGimbalResponseSpeed = true
		@gimbalRangeXP = 3
		@gimbalRangeXN = 3
	}
	@MODULE[ModuleColorChanger]:HAS[#moduleID[throttleColor]]
	{
		@includedRenderer = LP_BellThrottle
	}
	@MODULE[ModuleColorChanger]:HAS[#moduleID[heatColor]]
	{
		includedRenderer = LP_BellHull
		!excludedRenderer = nope
	}
}

// Nuclear
+PART[opt_vtol_lpj1]
{
	@name = opt_vtol_lpr2
	@title = #LOC_OPT_opt_vtol_lpr2_title
	@cost = 575
	@entryCost = 78000
	@mass = 1.096
	@TechRequired = nuclearPropulsion
	@description = #LOC_OPT_opt_vtol_lpr2_desc
	@maxTemp = 2500
	@MODEL
	{
		@model = OPT/Parts/engines/VTOL/LP-R
	}
	@EFFECTS
	{
		!running_open {}
		!running_turbine {}
		!running_open2 {}
		!running_turbine2 {}
		@powersharp
		{
			// @MODEL_MULTI_PARTICLE[Lamp*]
			// {
				// @modelName = OPT_Reconfig/FX2/ARIVacLamp
			// }
			@MODEL_MULTI_PARTICLE[Flame*],*
			{
				@modelName = OPT_Reconfig/FX2/ARIRedFlameVac
				!localScale = 0
				energy = 0 0.45
				energy = 1 0.5
			}
		}
	}
	!MODULE[MultiModeEngine] {}
	@MODULE[ModuleEnginesFX],0
	{
		@engineID = Standard
		@ignitionThreshold = 0.01
		@maxThrust = 600
		@heatProduction = 250
		@useEngineResponseTime = False
		!engineAccelerationSpeed = 0.7
		!engineDecelerationSpeed = 0.35
		// @flameoutEffectName = flameout
		@powerEffectName = powersharp
		// @engageEffectName = engage
		// @disengageEffectName = disengage
		!spoolEffectName = running_turbine
		!engineSpoolIdle = 0.05
		!engineSpoolTime = 2.0
		@EngineType = Nuclear
		@PROPELLANT[LiquidFuel]
		{
			@ratio = 1
		}
		!PROPELLANT[IntakeAir] {}
		@atmosphereCurve
		{
			!key = nope
			key = 0 600
			key = 1 528
			key = 9 0.001
		}
		@atmChangeFlow = False
		@useVelCurve = False
		@useAtmCurve = False
		!velCurve {}
		!atmCurve{}
	}
	
	!MODULE[ModuleEnginesFX],1 {}
	@MODULE[ModuleGimbal]
	{
		@gimbalResponseSpeed = 4
		// @useGimbalResponseSpeed = true
		@gimbalRangeXP = 3
		@gimbalRangeXN = 3
	}
	@MODULE[ModuleColorChanger]:HAS[#moduleID[throttleColor]]
	{
		@includedRenderer = LP_BellThrottle
	}
	@MODULE[ModuleColorChanger]:HAS[#moduleID[heatColor]]
	{
		includedRenderer = LP_BellHull
		!excludedRenderer = nope
	}
	@MODULE[ModuleColorChanger]:HAS[#moduleID[throttleColor]]
	{
		@redCurve
		{
			@key,1 = 0.5 1
		}
		@greenCurve
		{
			@key,1 = 1 0.5
		}
		@blueCurve
		{
			@key,1 = 1 0.5
		}
	}
}