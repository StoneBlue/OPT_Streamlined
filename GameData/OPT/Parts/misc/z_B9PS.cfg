@PART[opt_intakeLinear]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Width
		switcherDescription = Width
		switcherDescriptionPlural = Widths
		baseVolume = 4
		SUBTYPE
		{
			name = w1
			title = 1x
			descriptionSummary = <b>Intake Area</b>: 0.4 m<sup>2</sup>
			transform = w1
			RESOURCE
			{
				name = IntakeAir
				UnitsPerVolume = 1
			}
		}
		SUBTYPE
		{
			name = w2
			title = 2x
			volumeAdded = 4
			descriptionSummary = <b>Intake Area</b>: 0.8 m<sup>2</sup>
			transform = w2
			addedMass = #$/mass$
			addedCost = #$/cost$
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceIntake
					resourceName = IntakeAir
				}
				DATA
				{
					area = 0.008
				}
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceIntake
					resourceName = IntakeAtm
				}
				DATA
				{
					area = 0.008
				}
			}
			RESOURCE
			{
				name = IntakeAir
				UnitsPerVolume = 1
			}
		}
		SUBTYPE
		{
			name = w3
			title = 3x
			volumeAdded = 8
			descriptionSummary = <b>Intake Area</b>: 1.2 m<sup>2</sup>
			transform = w3
			addedMass = #$/mass$
			@addedMass *= 2
			addedCost = #$/cost$
			@addedCost *= 2
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceIntake
					resourceName = IntakeAir
				}
				DATA
				{
					area = 0.012
				}
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceIntake
					resourceName = IntakeAtm
				}
				DATA
				{
					area = 0.012
				}
			}
			RESOURCE
			{
				name = IntakeAir
				UnitsPerVolume = 1
			}
		}
		SUBTYPE
		{
			name = w4
			title = 4x
			volumeAdded = 12
			descriptionSummary = <b>Intake Area</b>: 1.6 m<sup>2</sup>
			transform = w4
			addedMass = #$/mass$
			@addedMass *= 3
			addedCost = #$/cost$
			@addedCost *= 3
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceIntake
					resourceName = IntakeAir
				}
				DATA
				{
					area = 0.016
				}
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceIntake
					resourceName = IntakeAtm
				}
				DATA
				{
					area = 0.016
				}
			}
			RESOURCE
			{
				name = IntakeAir
				UnitsPerVolume = 1
			}
		}
	}
}

@PART[opt_intakeSRAT]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Width
		switcherDescription = Width
		switcherDescriptionPlural = Widths
		SUBTYPE
		{
			name = w1
			title = 2x
			descriptionSummary = <b>Generates</b>: 60 EC/s
			transform = w1
		}
		SUBTYPE
		{
			name = w2
			title = 3x
			descriptionSummary = <b>Generates</b>: 90 EC/s
			transform = w2
			addedMass = #$/mass$
			@addedMass *= 0.5
			addedCost = #$/cost$
			@addedCost *= 0.5
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
					ConverterName = RamPower
				}
				DATA
				{
					OUTPUT_RESOURCE
					{
						ResourceName = ElectricCharge
						Ratio = 90
						DumpExcess = False
					}
				}
			}
		}
		SUBTYPE
		{
			name = w3
			title = 4x
			descriptionSummary = <b>Generates</b>: 120 EC/s
			transform = w3
			addedMass = #$/mass$
			@addedMass *= 2
			addedCost = #$/cost$
			@addedCost *= 2
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
					ConverterName = RamPower
				}
				DATA
				{
					OUTPUT_RESOURCE
					{
						ResourceName = ElectricCharge
						Ratio = 120
						DumpExcess = False
					}
				}
			}
		}
	}
}