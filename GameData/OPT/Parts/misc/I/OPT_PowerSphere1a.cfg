PART
{
	name = opt_powersphere1a
	author = JadeOfMaar
	module = Part
	
	//descriptions
	
	title = #LOC_OPT_opt_powersphere1a_title
	manufacturer = #LOC_OPT_manufacturerP
	description = #LOC_OPT_opt_powersphere1a_desc
	bulkheadProfiles = size1,srf
	mass = 0.89
	tags = #LOC_OPT_tags_electric
	
	//category, technology and cost
	category = Electrical
	subcategory = 0.0
	TechRequired = specializedElectrics
	cost = 9600
	entryCost = 22400
	
	//temperatures
	// skinMaxTemp = 2000
	maxTemp = 2000
	emissiveConstant = 0.88 // rather great at radiating
	thermalMassModifier = 4.0
	skinInternalConductionMult = 2000
	emissiveConstant = 0.88
	heatConductivity = 0.001 // great insulation
	
	//tolerances
	crashTolerance = 20
	// breakingForce = 400
	// breakingTorque = 400
	
	MODEL
	{
		model = OPT/Parts/misc/I/OPT_PowerSphere1a
		scale = 1, 1, 1
	}
	
	//scales
	rescaleFactor = 1.0
	
	//others
	attachRules = 1,1,1,0,0
	dragModelType = default
	fuelCrossFeed = True
	
	node_stack_bottom = 0.0, -0.55, 0.0, 0.0, -1.0, -0.0, 1
	node_attach = 0.0, -0.55, 0.0, 0.0, -1.0, -0.0, 1
	
	
	RESOURCE
	{
		name = ElectricCharge
		amount = 150
		maxAmount = 150
	}
	
	MODULE
	{
		name = ModuleAnimateHeat
		ThermalAnim = LEDheat
	}
	
	MODULE
	{
		name = ModuleOverheatDisplay
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Super Cell
		StartActionName = Start Super Cell
		StopActionName = Stop Super Cell
		ToggleActionName = Toggle Super Cell
		GeneratesHeat = True
		UseSpecialistBonus = false
		AutoShutdown = true
		TemperatureModifier
		{
			key = 0 10000 0 -10.66
			key = 800 4000 -4.66 -4.66
			key = 3000 0 0 0
		}
		DefaultShutoffTemp = .8
		ThermalEfficiency 
		{
			key = 0 0 0 0
			key = 500 0.3
			key = 800 1 0 0
			key = 1200 0.3
			key = 1800 0 0 0
		}
		INPUT_RESOURCE
		{
			ResourceName = LiquidFuel
			Ratio = 0.045
		}
		INPUT_RESOURCE
		{
			ResourceName = Oxidizer
			Ratio = 0.055
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 150
			// DumpExcess = True
		}
	}
	
	MODULE
	{
		name = ModuleAnimationGroup
		deployAnimationName = LEDinit
		activeAnimationName = LEDpulse
		deployActionName = Prime Reactor
		retractActionName = Rest Reactor
		toggleActionName = Toggle Reactor
		moduleType = #autoLOC_7001227 //Converter
		// autoDeploy = true
	}
		
	MODULE
	{
		name = ModuleCoreHeat
		CoreTempGoal = 800					//I/nternal temp goal - we don't transfer till we hit this point
		CoreToPartRatio = 0.1				//Scale back cooling if the part is this % of core temp
		CoreTempGoalAdjustment = 0			//Dynamic goal adjustment
		CoreEnergyMultiplier = 0.1			//What percentage of our core energy do we transfer to the part
		HeatRadiantMultiplier = 0.05		//I/f the core is hotter, how much heat radiates?
		CoolingRadiantMultiplier = 0		//I/f the core is colder, how much radiates?
		HeatTransferMultiplier = 0			//I/f the part is hotter, how much heat transfers in?
		CoolantTransferMultiplier = 0.01	//I/f the part is colder, how much of our energy can we transfer?
		radiatorCoolingFactor = 1			//How much energy we pull from core with an active radiator?  >= 1
		radiatorHeatingFactor = 0.05		//How much energy we push to the active radiator
		MaxCalculationWarp = 1000			//Based on how dramatic the changes are, this is the max rate of change
		CoreShutdownTemp = 1000				//At what core temperature do we shut down all generators on this part?
		MaxCoolant = 100					//Maximum amount of radiator capacity we can consume - 50 = 1 small
	}
}