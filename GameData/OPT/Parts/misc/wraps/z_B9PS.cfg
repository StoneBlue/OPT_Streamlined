@PART[opt_?_wrapPV]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Height
		switcherDescription = Height
		switcherDescriptionPlural = Heights
		SUBTYPE
		{
			name = 1x
			title = Short
			primaryColor = CobaltBlue
			secondaryColor = CobaltBlue
			descriptionSummary = #Charge per side: $/refPower$ EC/s
			transform = short
		}
		SUBTYPE
		{
			name = 2x
			title = Tall
			primaryColor = CobaltBlue
			secondaryColor = CobaltBlue
			descriptionSummary = #Charge per side: $/refPower2$ EC/s
			transform = tall
			addedMass = #$/mass$
			addedCost = #$/cost$
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleDeployableSolarPanel
					secondaryTransformName = sunCatcher1
				}
				DATA
				{
					chargeRate = #$/refPower2$
				}
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleDeployableSolarPanel
					secondaryTransformName = sunCatcher2
				}
				DATA
				{
					chargeRate = #$/refPower2$
				}
			}
		}
	}
}

@PART[opt_?_wrapRad?]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Height
		switcherDescription = Height
		switcherDescriptionPlural = Heights
		SUBTYPE
		{
			name = 1x
			title = 2m
			transform = short
		}
		SUBTYPE
		{
			name = 2x
			title = 4m
			transform = tall
		}
	}
	@MODULE[ModuleB9PartSwitch]
	{
		@SUBTYPE,0
		{
			descriptionSummary = #<b>Energy Transfer</b>: $/refPower$ kW
		}
		@SUBTYPE,1
		{
			descriptionSummary = #<b>Energy Transfer</b>: $/refPower2$ kW
			addedCost = #$/cost$
			addedMass = #$/mass$
		}
		@SUBTYPE,1:NEEDS[!SystemHeat]
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleActiveRadiator
				}
				DATA
				{
					maxEnergyTransfer = #$/refPower2$
					@maxEnergyTransfer *= 50
					RESOURCE
					{
						name = ElectricCharge
						rate = #$/refECReq$
						@rate *= 2
					}
				}
			}
		}
	}
}

@PART[opt_?_wrapRad?]:NEEDS[SystemHeat]
{
	// refTempL0 = #$refTemp$
	// refTempPeak = #$refTemp$
	// refTempH0 = #$refTemp$
	// @refTempL0 -= 300
	// @refTempPeak += 200
	// @refTempH0 += 400
	
	!MODULE[ModuleAnimateHeat] {}
	MODULE
	{
		name = ModuleSystemHeatColorAnimator
		moduleID = heat
		useRate = false
		animRate = 1
		shaderProperty = _EmissiveColor
		toggleInEditor = false
		toggleInFlight = false
		redCurve
		{
			key = 0 1
			key = 1 1
		}
		greenCurve
		{
			key = 0 1
			key = 1 1
		}
		blueCurve
		{
			key = 0 1
			key = 1 1
		}
		alphaCurve
		{
			key = 0 0
			key = 1 1
		}
	}
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/refArea$
		@volume *= 0.01
		moduleID = default
		iconName = Icon_Radiator
		ignoreTemperature = true
	}
	@MODULE[ModuleActiveRadiator]
	{
		@name = ModuleSystemHeatRadiator
		moduleID = radiator
		// ModuleSystemHeat instance to link to
		systemHeatModuleID = default
		scalarModuleID = heat
		maxTempAnimation = 1400

		// option: use deterministic temperatures
		// Power radiated per temperature
		temperatureCurve
		{
			key = 0 0
			key = #$/refTemp$ $/refPower$
		}
		// area for convection
		convectiveArea = #$/refArea$
	}
	
	@MODULE[ModuleB9PartSwitch]
	{
		@SUBTYPE,1
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeatRadiator
				}
				DATA
				{
					temperatureCurve
					{
						key = 0 0
						key = #$/refTemp$ $/refPower2$
					}
					RESOURCE
					{
						name = ElectricCharge
						rate = #$/refECReq$
						@rate *= 2
					}
					convectiveArea = #$/refArea$
					@convectiveArea *= 2
				}
			}
		}
	}
}

@PART[opt_?_wrapRad?]:NEEDS[zKerbalismSystemHeat]
{
	@MODULE[ModuleSystemHeatRadiator]
	{
		@name = SystemHeatRadiatorKerbalism
	}
	@MODULE[ModuleB9PartSwitch]
	{
		@SUBTYPE,1
		{
			@MODULE:HAS[@IDENTIFIER[ModuleSystemHeatRadiator]]
			{
				@IDENTIFIER
				{
					@name = SystemHeatRadiatorKerbalism
				}
			}
		}
	}
}